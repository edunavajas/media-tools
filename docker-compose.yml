# Optional: local development/testing. Transcription goes to the Nan Builders
# Whisper API (or Groq) over the network; set NAN_API_KEY before starting.
services:
  app:
    build: .
    ports:
      - "8001:8000"
    environment:
      MEDIA_TOOLS_TOKEN: ${MEDIA_TOOLS_TOKEN:-dev-token}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-nan}
      NAN_BASE_URL: ${NAN_BASE_URL:-https://api.nan.builders/v1}
      NAN_API_KEY: ${NAN_API_KEY:-}
      NAN_MODEL: ${NAN_MODEL:-whisper}
      TIMEOUT_SECONDS: "1800"
      DATA_DIR: /data
      YTDLP_AUTOUPDATE: "0"
    volumes:
      - media-tools-data:/data

volumes:
  media-tools-data:
